[project]
name = "aether"
version = "0.1.0"
description = "Nebula segmentation and 3D visualization from 2D"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "kagglehub>=1.0.2",
    "numpy>=2.0.0",
    "pillow>=12.3.0",
    "pyvista>=0.49.0",
    "pyyaml>=6.0.3",
    "scipy>=1.15.3",
    "torch>=2.14.0",
    "torchvision>=0.29.1",
]

[project.scripts]
aether = "aether.__main__:main"
aether-dataset = "aether.io.dataset:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aether"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
